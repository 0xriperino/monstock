[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["contracts/lib"]
solc_version = "0.8.24"
evm_version = "paris"
chain_id = 10143
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/", "forge-std/=contracts/lib/forge-std/src/"]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
